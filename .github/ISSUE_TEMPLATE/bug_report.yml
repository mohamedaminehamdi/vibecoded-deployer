name: Bug report
description: A workflow run or Terraform apply did not do what the documentation says it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        **Do not paste secrets** (AWS keys, GoDaddy keys, tokens). Redact AWS account IDs and any domain you do not want public. Workflow logs mask secret values, but check before you paste.
  - type: dropdown
    id: area
    attributes:
      label: Which part is affected?
      options:
        - Deploy workflow
        - Destroy workflow
        - Terraform bootstrap (state bucket)
        - Terraform modules (s3, acm, cloudfront)
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: dns
    attributes:
      label: DNS provider
      options:
        - Route 53
        - GoDaddy
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the workflow inputs you used (`repo_name`, `subdomain`, `dns_provider`, `force_infrastructure`) and the name of the step that failed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: The failing step's output, trimmed to the relevant lines.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps, for example whether this is a first deploy or a redeploy, or whether you changed any defaults (region, state bucket name).
