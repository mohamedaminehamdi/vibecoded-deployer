name: Lint

# Static checks only. No cloud credentials or repository secrets are used.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir:
          - terraform
          - terraform/bootstrap
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff
        working-directory: ${{ matrix.dir }}

      - name: Initialize (no backend)
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}

      - name: Validate
        run: terraform validate
        working-directory: ${{ matrix.dir }}

  workflows:
    name: Workflow files (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint 1.7.7, pinned by digest. The three ignored shellcheck rules
      # (unquoted variables, repeated redirects, useless cat) are style-level
      # findings in the existing deploy/destroy scripts.
      - name: Run actionlint
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -color \
            -ignore 'SC2002:style' \
            -ignore 'SC2086:info' \
            -ignore 'SC2129:style'
