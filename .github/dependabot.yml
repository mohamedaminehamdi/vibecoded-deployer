version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directories:
      - /terraform
      - /terraform/bootstrap
      - /terraform/modules/acm
    schedule:
      interval: weekly
    commit-message:
      prefix: terraform
